# Role -> model alias for MODEL_PROFILE=hosted (hosted open-weight model APIs via LiteLLM).
# Aliases are LiteLLM model_names defined in litellm.hosted.yaml.
# Providers must offer zero data retention (spec, Privacy section).
# Switching to this profile needs only the keys in requires_env (see .env.example).
profile: hosted
gateway:
  base_url: http://litellm:4000/v1
  api_key_env: LITELLM_MASTER_KEY
  timeout_s: 60
  requires_env: [HOSTED_API_KEY]

roles:
  extractor: hosted-extractor
  planner: hosted-planner
  interviewer: hosted-interviewer
  scorer: hosted-scorer
  stt: hosted-stt
  tts: hosted-tts

# Capability registry. Code checks these flags, never model names.
# tier (small, medium, large) picks prompt variants: prompts/<role>/<name>.<tier>.v<N>.txt.
models:
  hosted-extractor:
    kind: chat
    supports_tools: true
    json_mode: true
    context_window: 131072
    tier: large
  hosted-planner:
    kind: chat
    # false: the gateway asks for JSON that matches the schema (NativeOutput), not a tool call.
    # With tool calls, Groq rejected the gap analysis (HTTP 400, tool_use_failed).
    supports_tools: false
    json_mode: true
    context_window: 131072
    tier: large
  hosted-interviewer:
    kind: chat
    supports_tools: true
    json_mode: true
    context_window: 131072
    tier: large
  hosted-scorer:
    kind: chat
    # false: the gateway asks for JSON that matches the schema (NativeOutput), not a tool call.
    # With tool calls, Groq rejected the gap analysis (HTTP 400, tool_use_failed).
    supports_tools: false
    json_mode: true
    context_window: 131072
    tier: large
  hosted-stt:
    kind: stt
    context_window: 512
    options:
      language: en
  hosted-tts:
    kind: tts
    context_window: 512
    streaming: true
    sample_rate: 24000
    options:
      voice: af_heart
