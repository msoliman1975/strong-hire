# Role -> model alias for MODEL_PROFILE=local (Docker on this machine, CPU only).
# Aliases are LiteLLM model_names defined in litellm.local.yaml. Code never sees vendor ids.
# Model picks are placeholders until the P1 model spike chooses them.
profile: local
gateway:
  base_url: http://litellm:4000/v1     # overridden by MODEL_GATEWAY_URL when running outside Docker
  api_key_env: LITELLM_MASTER_KEY
  timeout_s: 120

roles:
  extractor: local-small
  planner: local-mid
  interviewer: local-small
  scorer: local-mid
  stt: local-stt
  tts: local-tts

# Capability registry. Code checks these flags, never model names.
models:
  local-small:
    kind: chat
    supports_tools: true
    json_mode: true
    context_window: 32768
  local-mid:
    kind: chat
    supports_tools: true
    json_mode: true
    context_window: 32768
  local-stt:
    kind: stt
    context_window: 512
    options:
      language: en
  local-tts:
    kind: tts
    context_window: 512
    options:
      voice: af_heart
