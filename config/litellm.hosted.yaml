# LiteLLM proxy config for MODEL_PROFILE=hosted. Real model ids and providers appear only here
# and in litellm.local.yaml.
#
# Placeholder provider: Groq (low first-token latency, OpenAI-compatible, Whisper hosted).
# HOSTED_API_KEY holds the Groq API key. Before real users, turn on zero data retention in the
# Groq console (Settings > Data controls), as the spec's Privacy section requires.
# To use another provider for a role, change that entry and add its key to .env and to
# requires_env in models.hosted.yaml. Code does not change.
model_list:
  - model_name: hosted-extractor          # mid-size, 1000 tokens/s
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/HOSTED_API_KEY
      reasoning_effort: low
  - model_name: hosted-planner            # 120B open-weight
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/HOSTED_API_KEY
      reasoning_effort: medium
  - model_name: hosted-interviewer        # reasoning off, so the first token is fast (82 to 111 ms)
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/HOSTED_API_KEY
      reasoning_effort: none
  - model_name: hosted-scorer             # strongest open-weight model on this provider
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/HOSTED_API_KEY
      reasoning_effort: high
  - model_name: hosted-stt                # Whisper large-v3-turbo, hosted
    litellm_params:
      model: groq/whisper-large-v3-turbo
      api_key: os.environ/HOSTED_API_KEY
    model_info:
      mode: audio_transcription
  - model_name: hosted-tts                # Orpheus on Groq; WAV only, 24 kHz (first audio about 0.2 s)
    litellm_params:
      model: groq/canopylabs/orpheus-v1-english
      api_key: os.environ/HOSTED_API_KEY
    model_info:
      mode: audio_speech

litellm_settings:
  drop_params: true
  request_timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
