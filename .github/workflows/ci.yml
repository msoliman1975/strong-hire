name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest, schemas)
    runs-on: ubuntu-latest
    env:
      MODEL_PROFILE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest
      - name: JSON Schemas are fresh
        run: uv run python -m strong_core.export_schemas --check

  migrations:
    name: Migrations on a fresh Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strong
          POSTGRES_PASSWORD: strong
          POSTGRES_DB: strong
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strong" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://strong:strong@localhost:5432/strong
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - name: upgrade, check for model drift, downgrade, upgrade again
        run: |
          A="uv run alembic -c packages/core/alembic.ini"
          $A upgrade head
          $A check
          $A downgrade base
          $A upgrade head
      - name: Database rules on the migrated schema (one Published profile per company; AC-1 delete)
        env:
          MODEL_PROFILE: fake
          STRONG_TEST_POSTGRES_URL: postgresql+psycopg://strong:strong@localhost:5432/strong
        run: uv run pytest packages/core/tests/test_profiles.py apps/api/tests/test_account.py -k postgres -rs
      - name: seed is repeatable
        run: |
          uv run python -m strong_core.db.seed
          uv run python -m strong_core.db.seed

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # P03 auth/web: Playwright smoke tests of the main journey (all API calls mocked with MSW)
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm test:e2e
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  compose:
    name: Docker stack (core profile) starts and /health is OK through the web page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: All profiles parse
        run: docker compose -f infra/compose.yaml --env-file .env.example --profile core --profile models --profile voice config --quiet
      - name: Start core profile
        run: |
          cp .env.example .env
          docker compose -f infra/compose.yaml --env-file .env --profile core up -d --build --wait
      - name: Migrate and seed
        run: |
          C="docker compose -f infra/compose.yaml --env-file .env --profile core"
          $C exec -T api alembic -c packages/core/alembic.ini upgrade head
          $C exec -T api python -m strong_core.db.seed
      - name: Health through the web proxy
        run: |
          curl -sf http://localhost:5180/api/health | tee health.json
          grep -q '"status":"ok"' health.json
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml --env-file .env --profile core logs --tail 100

  models-voice:
    name: Local models (smoke test all six roles)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL_PROFILE: local
      LITELLM_PROFILE: local
      OLLAMA_MAX_LOADED_MODELS: "1"
    steps:
      - name: Free disk space for model images and weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Add 8 GB of swap (the runner has 7.9 GB of RAM)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -m
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: cp .env.example .env
      - name: Pull the local models named in config/
        shell: pwsh
        run: ./scripts/models.ps1 pull
      - name: Smoke test all six roles (local), then hosted (skips without HOSTED_API_KEY)
        shell: pwsh
        env:
          HOSTED_API_KEY: ${{ secrets.HOSTED_API_KEY }}
        run: |
          ./scripts/models.ps1 smoke -Profile local
          ./scripts/models.ps1 smoke -Profile hosted
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml --env-file .env --profile models --profile voice logs --tail 150

  changes:
    name: Find voice changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Always "true" on push to main. On a PR, "true" only when a voice path changed.
      voice: ${{ github.event_name != 'pull_request' || steps.filter.outputs.voice == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            voice:
              - 'apps/voice/**'
              - 'packages/core/src/strong_core/gateway/**'
              - 'config/**'
              - 'scripts/latency.ps1'
              - 'scripts/lib/stack.ps1'
              - 'infra/**'
              - '.github/workflows/ci.yml'

  voice-latency:
    name: Voice latency spike (simulated candidate)
    # About 15 minutes on CPU, so it runs only for voice changes and on every push to main.
    needs: changes
    if: needs.changes.outputs.voice == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL_PROFILE: local
      LITELLM_PROFILE: local
      OLLAMA_MAX_LOADED_MODELS: "1"
    steps:
      - name: Free disk space for model images and weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Add 8 GB of swap (the runner has 7.9 GB of RAM)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -m
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: cp .env.example .env
      - name: Build and pull images before the run, so builds do not compete for memory
        run: |
          C="docker compose -f infra/compose.yaml --env-file .env --profile models --profile voice"
          $C build
          $C pull --ignore-buildable
      - name: Pull the local models named in config/
        shell: pwsh
        run: ./scripts/models.ps1 pull
      - name: Latency spike, with memory use printed every 15 s
        env:
          HOSTED_API_KEY: ${{ secrets.HOSTED_API_KEY }}
        run: |
          ( while true; do
              echo "mem: $(free -m | awk 'NR==2 {print $3 " MB used of " $2}')"
              docker stats --no-stream --format 'mem: {{.Name}} {{.MemUsage}}' 2>/dev/null
              sleep 15
            done ) &
          pwsh ./scripts/latency.ps1 -Sessions 3 -ReplyTimeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latency
          path: var/latency/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml --env-file .env --profile models --profile voice logs --tail 200
