<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strova avatar reference</title>
<style>
body { margin: 0; padding: 32px; font: 15px/1.5 system-ui, sans-serif; background: #f4f3f8; color: #17161f; }
h1 { margin: 0 0 4px; font-size: 26px; }
p { margin: 0 0 24px; color: #5e5b6b; max-width: 70ch; }
.row { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; padding: 20px; margin-bottom: 16px; background: #fff; border: 1px solid #e2e0ea; border-radius: 16px; }
.row h2 { width: 140px; margin: 0; font-size: 16px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #5e5b6b; }
.sv-box { transform-box: fill-box; transform-origin: center; }
.sv-spin { transform-box: view-box; transform-origin: 100px 100px; animation: sv-spin 9s linear infinite; }
.sv-pulse-ring { transform-box: view-box; transform-origin: 100px 100px; animation: sv-ring 1.6s ease-in-out infinite; }
.sv-blink { animation: sv-blink 4.5s infinite; }
.sv-dot { animation: sv-dot 1.4s ease-in-out infinite; }
.sv-d2 { animation-delay: .2s; } .sv-d3 { animation-delay: .4s; }
.sv-scan { animation: sv-scan 2.4s ease-in-out infinite; }
.sv-bob { animation: sv-bob 2.6s ease-in-out infinite; }
.sv-twinkle { animation: sv-twinkle 1.8s ease-in-out infinite; }
.sv-check { stroke-dasharray: 30; animation: sv-check 2.4s ease-in-out infinite; }
.sv-wave { animation: sv-wave 1.2s ease-in-out infinite; }
.sv-talk { animation: sv-talk .35s ease-in-out infinite alternate; }
.sv-float { animation: sv-float 2.2s ease-in-out infinite; }
@keyframes sv-spin { to { transform: rotate(360deg); } }
@keyframes sv-ring { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
@keyframes sv-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes sv-dot { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
@keyframes sv-scan { 0%, 100% { transform: translate(-14px, -22px); } 50% { transform: translate(0, 0); } }
@keyframes sv-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes sv-twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.25) rotate(20deg); } }
@keyframes sv-check { 0%, 20% { stroke-dashoffset: 30; } 50%, 100% { stroke-dashoffset: 0; } }
@keyframes sv-wave { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
@keyframes sv-talk { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
@keyframes sv-float { 0% { transform: translateY(4px) scale(.9); opacity: .5; } 50% { opacity: 1; } 100% { transform: translateY(-6px) scale(1.1); opacity: .5; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sv-check { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<h1>Strova avatar reference</h1>
<p>The approved avatar in all seven modes at 160, 104, 72, 40, 28 and 18 px, animated. Generated from <code>strova()</code> in <code>mockups.html</code>; the React component (U02) must match it exactly. Thinking is shown in both hats.</p>
<div id="sheet"></div>
<script>
const ZIG = (() => { const n = 56; let d = ''; for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2; const r = i % 2 ? 90 : 96; d += (i ? 'L' : 'M') + (100 + r * Math.cos(a)).toFixed(1) + ' ' + (100 + r * Math.sin(a)).toFixed(1) + ' '; } return d + 'Z'; })();
let strovaN = 0;
function strova(mode, size) {
  const id = 'sv' + (++strovaN);
  const fx = size >= 64;
  const interviewer = mode === 'interviewing' || mode === 'speaking' || mode === 'listening';
  const accent = interviewer ? '#0b6e8c' : mode === 'celebrating' ? '#12775a' : '#5332e6';
  const soft = interviewer ? '#e0f2f7' : mode === 'celebrating' ? '#e3f4ec' : '#eeeafe';
  const hair = '#6b4226', skin = '#e8b996', shade = '#d6a37f', top = '#a99bdc';
  const mouth = { listening: 'M94 116 Q100 117.5 106 116', thinking: 'M93 117 Q99 115 107 118', analysing: 'M91 116 L109 116', coaching: 'M91 114 Q100 120 109 114', interviewing: 'M91 116 L109 116', celebrating: 'M91 114 Q100 120 109 114' }[mode] || 'M92 115 Q100 119 108 115';
  const up = mode === 'thinking', down = mode === 'analysing', browUp = mode === 'thinking' || mode === 'celebrating';
  const eL = up ? 88 : down ? 85 : 86, eR = up ? 116 : down ? 113 : 114, eY = up ? 92 : down ? 99 : 96;
  const eRY = mode === 'coaching' || mode === 'celebrating' ? 4.4 : 5;
  const bL = browUp ? 'M79 82 Q86 77 93 81' : mode === 'interviewing' ? 'M78 84 L94 83' : 'M78 83 Q86 79 94 82';
  const bR = browUp ? 'M107 81 Q114 76 121 82' : mode === 'interviewing' ? 'M106 83 L122 84' : 'M106 82 Q114 79 122 83';
  const zig = mode === 'thinking' || mode === 'analysing';
  const ringCls = mode === 'celebrating' || mode === 'speaking' ? 'sv-pulse-ring' : '';
  const label = { listening: 'Strova is listening', speaking: 'Strova is speaking', interviewing: 'Strova is interviewing', thinking: 'Strova is thinking', analysing: 'Strova is analysing', coaching: 'Strova is coaching', celebrating: 'Strova is celebrating' }[mode] || 'Strova';
  const T = 'translate(40 29.6) scale(1.2)';
  let fxs = '';
  if (fx && mode === 'thinking') fxs = `<circle class="sv-box sv-dot" cx="150" cy="58" r="5" fill="${accent}"/><circle class="sv-box sv-dot sv-d2" cx="163" cy="42" r="7" fill="${accent}"/><circle class="sv-box sv-dot sv-d3" cx="178" cy="24" r="10" fill="${accent}"/>`;
  if (fx && mode === 'analysing') fxs = `<rect x="132" y="120" width="52" height="64" rx="8" fill="#fff" stroke="${accent}" stroke-width="3"/><line x1="142" y1="136" x2="174" y2="136" stroke="${accent}" stroke-width="3" stroke-linecap="round"/><line x1="142" y1="148" x2="168" y2="148" stroke="#c9c5d6" stroke-width="3" stroke-linecap="round"/><line x1="142" y1="160" x2="172" y2="160" stroke="#c9c5d6" stroke-width="3" stroke-linecap="round"/><g class="sv-scan"><circle cx="170" cy="168" r="9" fill="none" stroke="${accent}" stroke-width="3"/><line x1="176" y1="175" x2="184" y2="183" stroke="${accent}" stroke-width="3.5" stroke-linecap="round"/></g>`;
  if (fx && mode === 'coaching') fxs = `<g class="sv-bob"><path d="M140 22 H186 A10 10 0 0 1 196 32 V54 A10 10 0 0 1 186 64 H160 L150 74 L151 64 H140 A10 10 0 0 1 130 54 V32 A10 10 0 0 1 140 22 Z" fill="${accent}"/><path class="sv-box sv-twinkle" d="M163 32 L166 40 L174 43 L166 46 L163 54 L160 46 L152 43 L160 40 Z" fill="#fff"/></g>`;
  if (fx && mode === 'interviewing') fxs = `<rect x="138" y="128" width="44" height="54" rx="6" fill="#fff" stroke="${accent}" stroke-width="3"/><rect x="150" y="122" width="20" height="10" rx="3" fill="${accent}"/><line x1="146" y1="146" x2="174" y2="146" stroke="#c9c5d6" stroke-width="3" stroke-linecap="round"/><line x1="146" y1="158" x2="170" y2="158" stroke="#c9c5d6" stroke-width="3" stroke-linecap="round"/><path class="sv-check" d="M146 170 L152 175 L162 165" fill="none" stroke="${accent}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (fx && mode === 'speaking') fxs = `<path class="sv-wave" d="M150 100 Q158 112 150 124" fill="none" stroke="${accent}" stroke-width="4" stroke-linecap="round"/><path class="sv-wave sv-d2" d="M162 92 Q176 112 162 132" fill="none" stroke="${accent}" stroke-width="4" stroke-linecap="round"/><path class="sv-wave sv-d3" d="M174 84 Q194 112 174 140" fill="none" stroke="${accent}" stroke-width="4" stroke-linecap="round"/>`;
  if (fx && mode === 'listening') fxs = `<path class="sv-wave sv-d2" d="M42 86 Q34 98 42 110" fill="none" stroke="${accent}" stroke-width="4" stroke-linecap="round"/><path class="sv-wave" d="M30 78 Q18 98 30 118" fill="none" stroke="${accent}" stroke-width="4" stroke-linecap="round"/>`;
  if (fx && mode === 'celebrating') fxs = `<path class="sv-box sv-twinkle" d="M36 40 L40 50 L50 54 L40 58 L36 68 L32 58 L22 54 L32 50 Z" fill="#12775a"/><path class="sv-box sv-twinkle sv-d2" d="M164 30 L167 38 L175 41 L167 44 L164 52 L161 44 L153 41 L161 38 Z" fill="${accent}"/><circle class="sv-box sv-float" cx="170" cy="74" r="4" fill="#a34d00"/><circle class="sv-box sv-float sv-d3" cx="30" cy="84" r="4" fill="${accent}"/>`;
  return `<svg role="img" aria-label="${label}" width="${size}" height="${size}" viewBox="0 0 200 200" style="flex:none">
  <circle cx="100" cy="100" r="96" fill="${soft}"/>
  ${zig ? `<path class="sv-spin" d="${ZIG}" fill="none" stroke="${accent}" stroke-width="4" stroke-linejoin="round"/>` : `<circle class="${ringCls}" cx="100" cy="100" r="93" fill="none" stroke="${accent}" stroke-width="6"/>`}
  <defs><clipPath id="${id}"><circle cx="100" cy="100" r="93"/></clipPath></defs>
  <g clip-path="url(#${id})">
    <path d="M28 205 C28 162 60 144 100 144 C140 144 172 162 172 205 Z" fill="${top}"/>
    <path d="M84 145 L100 170 L116 145 Z" fill="${shade}"/>
    <path d="M78 147 L100 176 L90 186 Z" fill="rgba(23,22,31,0.12)"/><path d="M122 147 L100 176 L110 186 Z" fill="rgba(23,22,31,0.12)"/>
    <g transform="${T}" fill="${hair}"><path d="M47,88c-6.674,0-15,0-21-2c-6.077-2.026-9.104-6.691-8-13c0.868-4.959,5-15,5-23l21,9L47,88z"/><path d="M53.776,88c6.674,0,15,0,21-2c6.077-2.026,9.104-6.691,8-13c-0.868-4.959-5-15-5-23l-21,9L53.776,88z"/></g>
    <rect x="88" y="118" width="24" height="32" rx="10" fill="${shade}"/>
    <path transform="${T}" fill="${skin}" d="M81.5,51.317c-1.844-2.356-5.112-1.351-6.575,0.741c0.844-4.43,0.452-7.502,0.452-11.063c0-15.62-11.171-25.27-24.877-25.944v-0.038c-0.168,0.003-0.333,0.014-0.5,0.019c-0.167-0.006-0.332-0.016-0.5-0.019v0.038c-13.706,0.675-24.877,10.324-24.877,25.944c0,3.562-0.392,6.633,0.452,11.063c-1.463-2.092-4.731-3.097-6.575-0.741c-2.853,3.644-1.201,10.895,1.771,13.851c2.768,2.754,4.229,2.333,5.922,1.764c0.012-0.004,1.68,9.529,4.308,13.568c3.024,4.647,12.317,9.588,19,9.967h1c6.683-0.38,15.976-5.32,19-9.967c2.628-4.039,4.296-13.572,4.308-13.568c1.692,0.568,3.153,0.99,5.922-1.764C82.701,62.211,84.353,54.961,81.5,51.317z"/>
    <g transform="${T}" fill="${hair}"><path d="M26.996,50.572c0,0,1.059-3.728,1.139-9.039c0,0,29.191,5.185,33.143-23.857c0,0,0-4.09-10.906-4.771C36.698,12.05,23.825,25.855,23.825,36.761S26.996,50.572,26.996,50.572z"/><path d="M58.551,16.604c0,0-4.894,22.294,17.04,26.292l2.009-2.726l-2.69-9.543l-6.135-12.951l-6.816-2.045L58.551,16.604z"/><path d="M75.702,51.986c-0.126,0-0.256-0.012-0.385-0.037c-1.11-0.212-1.837-1.283-1.626-2.392c0.791-4.148,1.219-6.529,1.219-10.153c0-14.558-10.32-25.124-24.538-25.124c-1.13,0-2.045-0.915-2.045-2.045s0.915-2.045,2.045-2.045C66.961,10.191,79,22.477,79,39.405c0,3.949-0.454,6.525-1.291,10.918C77.522,51.304,76.664,51.986,75.702,51.986z"/><path d="M25.042,52.007c-0.963,0-1.82-0.682-2.007-1.663c-0.837-4.393-1.291-6.991-1.291-10.939c0-16.927,12.039-29.214,28.628-29.214c1.13,0,2.045,0.915,2.045,2.045s-0.915,2.045-2.045,2.045c-14.218,0-24.538,10.566-24.538,25.124c0,3.624,0.429,6.026,1.219,10.174c0.211,1.109-0.517,2.18-1.626,2.392C25.298,51.995,25.169,52.007,25.042,52.007z"/><path d="M28.471,41.181c0,0-0.191,6.582-1.484,10.795c-0.679,2.214-2.681,2.25-3.279,0.479c-0.829-2.455-0.694-9.215-0.407-12.136C26.125,39.984,28.471,41.181,28.471,41.181z"/><path d="M71.677,41.181c0,0,0.191,6.582,1.484,10.795c0.679,2.214,2.681,2.25,3.279,0.479c0.829-2.455,0.694-9.215,0.407-12.136C74.023,39.984,71.677,41.181,71.677,41.181z"/></g>
    <path d="${bL}" fill="none" stroke="${hair}" stroke-width="3.5" stroke-linecap="round"/><path d="${bR}" fill="none" stroke="${hair}" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse class="sv-box sv-blink" cx="${eL}" cy="${eY}" rx="4.2" ry="${eRY}" fill="#1f1a24"/><ellipse class="sv-box sv-blink" cx="${eR}" cy="${eY}" rx="4.2" ry="${eRY}" fill="#1f1a24"/>
    ${mode === 'speaking' ? '<ellipse class="sv-box sv-talk" cx="100" cy="116" rx="7" ry="5" fill="#7a2e2e"/>' : `<path d="${mouth}" fill="none" stroke="#9a3b3b" stroke-width="3" stroke-linecap="round"/>`}
  </g>
  ${fxs}
</svg>`;
}

const sizes = [160, 104, 72, 40, 28, 18];
const rows = ['listening', 'speaking', 'interviewing', 'thinking', 'analysing', 'coaching', 'celebrating'].map(m => [m, m]).concat([['thinking (interviewer hat)', 'thinking-i']]);
document.getElementById('sheet').innerHTML = rows.map(([label, m]) => `<div class="row"><h2>${label}</h2>${sizes.map(sz => `<div class="cell">${m === 'thinking-i' ? strovaHat('thinking', sz) : strova(m, sz)}<span>${sz} px</span></div>`).join('')}</div>`).join('');
function strovaHat(mode, size) { return strova(mode, size).replace(/#5332e6/g, '#0b6e8c').replace(/#eeeafe/g, '#e0f2f7'); }
</script>
</body>
</html>
