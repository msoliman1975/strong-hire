<style>
/* Layout: an app shell (top bar, left nav rail, content) under a slim prototype guide bar; the rail becomes a scrolling top strip on phones. Strong Hire v2 tokens. */
:root {
  --ground: #f4f3f8; --surface: #ffffff; --sunken: #ecebf2;
  --ink: #17161f; --ink-2: #3c3a48; --muted: #5e5b6b; --line: #e2e0ea; --line-strong: #c9c5d6;
  --violet: #5332e6; --violet-hover: #3d22c4; --violet-soft: #eeeafe; --violet-ink: #3d22c4; --violet-light: #a594ff;
  --teal: #0b6e8c; --teal-soft: #e0f2f7; --teal-light: #5cc3e0;
  --ok: #12775a; --ok-ink: #0f5f48; --ok-soft: #e3f4ec;
  --warn: #a34d00; --warn-ink: #8a4200; --warn-soft: #fdeedc;
  --bad: #b4321f; --bad-ink: #9a2c1b; --bad-soft: #fbe7e3;
  --lean: #7a600f;
  --p-context: #5e5b6b; --p-stakes: #a34d00; --p-action: #5332e6; --p-result: #12775a; --p-reflection: #0b6e8c;

  --room: #0e0d14; --room-raised: #1a1824; --room-line: #2c2938; --room-text: #f2f0f7; --room-muted: #a29fb0; --room-live: #ff6b5e;
  --guide: #17161f; --on-guide: #f4f3f8;
  --font: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #121118; --surface: #1b1a23; --sunken: #24222e; --ink: #f0eef6; --ink-2: #d4d1de; --muted: #a6a2b4; --line: #2e2b3a; --line-strong: #464157;
  --violet: #7b63ff; --violet-hover: #9480ff; --violet-soft: #2a2350; --violet-ink: #c4b8ff; --violet-light: #a594ff;
  --teal: #4fb3d1; --teal-soft: #11303a; --teal-light: #5cc3e0;
  --ok: #5fd0a8; --ok-ink: #8fe0c2; --ok-soft: #12302a; --warn: #f2a65a; --warn-ink: #f6bf86; --warn-soft: #3a2614;
  --bad: #ff8b78; --bad-ink: #ffab9c; --bad-soft: #3c1c17; --lean: #e3c35a;
  --p-context: #a6a2b4; --p-stakes: #f2a65a; --p-action: #a594ff; --p-result: #5fd0a8; --p-reflection: #5cc3e0;
  --hero: #26233a; --hero-line: #4d4766; --guide: #000000; color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #121118; --surface: #1b1a23; --sunken: #24222e; --ink: #f0eef6; --ink-2: #d4d1de; --muted: #a6a2b4; --line: #2e2b3a; --line-strong: #464157;
  --violet: #7b63ff; --violet-hover: #9480ff; --violet-soft: #2a2350; --violet-ink: #c4b8ff; --violet-light: #a594ff;
  --teal: #4fb3d1; --teal-soft: #11303a; --teal-light: #5cc3e0;
  --ok: #5fd0a8; --ok-ink: #8fe0c2; --ok-soft: #12302a; --warn: #f2a65a; --warn-ink: #f6bf86; --warn-soft: #3a2614;
  --bad: #ff8b78; --bad-ink: #ffab9c; --bad-soft: #3c1c17; --lean: #e3c35a;
  --p-context: #a6a2b4; --p-stakes: #f2a65a; --p-action: #a594ff; --p-result: #5fd0a8; --p-reflection: #5cc3e0;
  --hero: #26233a; --hero-line: #4d4766; --guide: #000000; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--font); }
a { color: var(--violet-ink); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--violet-ink); }
.eyebrow.teal { color: var(--teal); }
.eyebrow.plain { color: var(--muted); }

/* Guide bar */
.guide { background: var(--guide); color: var(--on-guide); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.guide .tag { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--violet-light); }
.guide select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 8px; border: 1px solid #45405a; background: #26233a; color: #f4f3f8; }
.guide .step { color: #c9c5d6; }
.guide .gbtn { padding: 4px 12px; border-radius: 999px; border: 1px solid #45405a; background: transparent; color: #f4f3f8; font-size: 13px; }
.guide .gbtn.primary { background: var(--violet); border-color: var(--violet); color: #fff; }
.guide .gbtn:disabled { opacity: 0.4; cursor: default; }
.guide .spacer { flex: 1 1 auto; }
.guide a { color: #c9c5d6; }

/* App shell */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; text-decoration: none; color: var(--ink); }
.brand .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--violet); }
.brand .with { font-weight: 400; font-size: 13px; color: var(--muted); }
.top-right { display: flex; align-items: center; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--violet-soft); color: var(--violet-ink); font-size: 12.5px; font-weight: 600; }
.avatar-me { width: 34px; height: 34px; border-radius: 999px; background: var(--sunken); display: inline-flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: var(--ink); text-decoration: none; }
.shell { display: flex; flex-wrap: wrap; align-items: flex-start; }

.solo { max-width: 860px; margin: 0 auto; padding: 40px 20px 64px; display: flex; flex-direction: column; gap: 22px; }

/* Building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.tight { padding: 14px 16px; gap: 6px; border-radius: 12px; }
.card.coach { border-top: 4px solid var(--violet); }

.card.dashed { border-style: dashed; border-color: var(--line-strong); }
.hero { background: var(--hero); color: var(--on-hero); border-radius: 20px; padding: 24px 26px; display: flex; flex-direction: column; gap: 10px; }
.hero .sub { color: var(--on-hero-muted); font-size: 14.5px; }
.hero .big { font-size: 24px; font-weight: 700; line-height: 1.25; max-width: 34ch; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent; background: var(--violet); color: #fff; font-weight: 600; text-decoration: none; font-size: 14.5px; }
.btn:hover { background: var(--violet-hover); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); font-weight: 500; }
.btn.ghost:hover { background: var(--sunken); }
.btn.quiet { background: transparent; color: var(--muted); border-color: transparent; font-weight: 500; padding: 0 10px; }
.btn.dark { background: var(--hero); color: var(--on-hero); }
.hero .btn.ghost { color: var(--on-hero); border-color: var(--hero-line); }
.hero .btn.ghost:hover { background: rgb(255 255 255 / 8%); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.v { background: var(--violet-soft); color: var(--violet-ink); border-color: transparent; }
.chip.t { background: var(--teal-soft); color: var(--teal); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok-ink); border-color: transparent; font-weight: 600; }
.chip.warn { background: var(--warn-soft); color: var(--warn-ink); border-color: transparent; font-weight: 600; }
.chip.bad { background: var(--bad-soft); color: var(--bad-ink); border-color: transparent; font-weight: 600; }
.chip.dark { background: var(--ink); color: var(--surface); border-color: transparent; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.bar { height: 8px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--teal); border-radius: 999px; }
.bar.v > span { background: var(--violet); }
.diff { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--ground); }
.diff del { color: var(--bad); }
.diff ins { color: var(--ok); text-decoration: none; }
.sugg { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.sugg .txt { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; text-decoration: none; color: var(--ink); }
.list-row:last-child { border-bottom: 0; }
.notice { padding: 12px 14px; border-radius: 12px; font-size: 14px; }
.notice.warn { background: var(--warn-soft); }
.notice.ok { background: var(--ok-soft); color: var(--ok-ink); }
.notice.v { background: var(--violet-soft); }
.notice.t { background: var(--teal-soft); }
.part { display: flex; flex-direction: column; gap: 3px; }
.part .lbl { font: 500 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--hero); color: var(--on-hero); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 20; }
.choice { display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); text-align: left; color: var(--ink); text-decoration: none; }
.choice:hover { border-color: var(--line-strong); }
.choice.sel { border-color: var(--violet); background: var(--violet-soft); }
.choice.t { border-color: var(--teal); background: var(--teal-soft); }
.choice.v { border-color: var(--violet); background: var(--violet-soft); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13.5px; }
.seg button.on { background: var(--violet-soft); border-color: var(--violet); color: var(--violet-ink); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field input, .field textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); }
.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 36px 20px; border: 2px dashed var(--line-strong); border-radius: 14px; background: var(--ground); text-align: center; }
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.steps span { padding: 4px 12px; border-radius: 999px; background: var(--sunken); color: var(--muted); font-size: 12.5px; }
.steps span.on { background: var(--violet-soft); color: var(--violet-ink); font-weight: 600; }
.steps span.done { background: var(--ok-soft); color: var(--ok-ink); }
.score { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.bubble { padding: 10px 14px; border-radius: 14px; max-width: 80%; font-size: 14.5px; }
.bubble.s { background: var(--violet-soft); }
.bubble.me { background: var(--sunken); align-self: flex-end; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.chatline { display: flex; gap: 10px; align-items: flex-start; }
.drawer { border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--ground); }
.planitem { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.planitem:last-child { border-bottom: 0; }
.planitem .day { width: 44px; flex: none; font: 500 12px var(--mono); color: var(--muted); padding-top: 2px; }
.check { width: 20px; height: 20px; flex: none; border-radius: 6px; border: 2px solid var(--line-strong); margin-top: 2px; display: inline-flex; align-items: center; justify-content: center; }
.check.done { background: var(--ok); border-color: var(--ok); }
.cgroup { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 14px; padding: 0 16px; }
.cgroup summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 14px 0; }
.cgroup summary::-webkit-details-marker { display: none; }
.cgroup .caret { transition: transform 0.15s; color: var(--muted); }
.cgroup[open] .caret { transform: rotate(180deg); }
.cgroup[open] summary { border-bottom: 1px solid var(--line); }
.fold summary { list-style: none; cursor: pointer; }
.fold summary::-webkit-details-marker { display: none; }
.fold .caret { transition: transform 0.15s; color: var(--muted); }
.fold[open] .caret { transform: rotate(180deg); }
.planitem.next { background: var(--violet-soft); margin: 0 -12px; padding: 12px; border-radius: 12px; border-bottom-color: transparent; }

/* Live room */
.room { background: var(--room); color: var(--room-text); min-height: 640px; display: flex; flex-direction: column; }
.room header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--room-line); }
.room .phases { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); font-size: 12.5px; }
.room .phases span { padding: 4px 12px; border-radius: 999px; background: var(--room-raised); color: var(--room-muted); }
.room .phases span.on { background: #0b6e8c; color: #fff; font-weight: 600; }
.room .body { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); flex: 1; }
.room .panel { background: var(--room-raised); border: 1px solid var(--room-line); border-radius: 20px; padding: 24px; }
.room .muted { color: var(--room-muted); }
.room .btn.ghost { color: var(--room-text); border-color: #45405a; }
.room .btn.end { background: var(--room-live); color: #0e0d14; }

@media (max-width: 760px) {
  .rail { flex-basis: 100%; max-width: none; flex-direction: row; overflow-x: auto; padding: 10px 16px; }
  .rail a { white-space: nowrap; }
  .rail .ask { margin-top: 0; }
  main { padding: 20px 16px 48px; }
  .grid2, .grid3, .grid4 { grid-template-columns: 1fr; }
}
.sv-box { transform-box: fill-box; transform-origin: center; }
.sv-spin { transform-box: view-box; transform-origin: 100px 100px; animation: sv-spin 9s linear infinite; }
.sv-pulse-ring { transform-box: view-box; transform-origin: 100px 100px; animation: sv-ring 1.6s ease-in-out infinite; }
.sv-blink { animation: sv-blink 4.5s infinite; }
.sv-dot { animation: sv-dot 1.4s ease-in-out infinite; }
.sv-d2 { animation-delay: .2s; } .sv-d3 { animation-delay: .4s; }
.sv-scan { animation: sv-scan 2.4s ease-in-out infinite; }
.sv-bob { animation: sv-bob 2.6s ease-in-out infinite; }
.sv-twinkle { animation: sv-twinkle 1.8s ease-in-out infinite; }
.sv-check { stroke-dasharray: 30; animation: sv-check 2.4s ease-in-out infinite; }
.sv-wave { animation: sv-wave 1.2s ease-in-out infinite; }
.sv-talk { animation: sv-talk .35s ease-in-out infinite alternate; }
.sv-float { animation: sv-float 2.2s ease-in-out infinite; }
@keyframes sv-spin { to { transform: rotate(360deg); } }
@keyframes sv-ring { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
@keyframes sv-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

@keyframes sv-scan { 0%, 100% { transform: translate(-14px, -22px); } 50% { transform: translate(0, 0); } }
@keyframes sv-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes sv-twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.25) rotate(20deg); } }
@keyframes sv-check { 0%, 20% { stroke-dashoffset: 30; } 50%, 100% { stroke-dashoffset: 0; } }
@keyframes sv-wave { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
@keyframes sv-talk { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
@keyframes sv-float { 0% { transform: translateY(4px) scale(.9); opacity: .5; } 50% { opacity: 1; } 100% { transform: translateY(-6px) scale(1.1); opacity: .5; } }
.hero-row { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.hero-row > div { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.reading { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 60px 20px; }

</style>

<script>
// Prototype of the Strong Hire experience from the UX discovery. Views are routed on the hash.
const state = {
  planStyle: 'weekly',
  tookTake: false,
  applied: false,
  craftStep: 0,
  reviewed: false,
  reviewApplied: false,
  roleStep: 1,
  drawer: false,
  ideasDismissed: {},
  liveMode: 'listening',
  iv: 'beh',
  role: 'stripe',
  story: 'checkout',
};
try { const saved = JSON.parse(localStorage.getItem('sh-mockups') || 'null'); if (saved) Object.assign(state, saved); } catch (e) {}
function save() { try { localStorage.setItem('sh-mockups', JSON.stringify(state)); } catch (e) {} }

// Strova, the approved avatar. Modes: listening, speaking, interviewing, thinking, analysing, coaching, celebrating.
const ZIG = (() => { const n = 56; let d = ''; for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2; const r = i % 2 ? 90 : 96; d += (i ? 'L' : 'M') + (100 + r * Math.cos(a)).toFixed(1) + ' ' + (100 + r * Math.sin(a)).toFixed(1) + ' '; } return d + 'Z'; })();
let strovaN = 0;
function strova(mode, size) {
  const id = 'sv' + (++strovaN);
  const fx = size >= 64;
  const interviewer = mode === 'interviewing' || mode === 'speaking' || mode === 'listening';
  const accent = interviewer ? '#0b6e8c' : mode === 'celebrating' ? '#12775a' : '#5332e6';
  const soft = interviewer ? '#e0f2f7' : mode === 'celebrating' ? '#e3f4ec' : '#eeeafe';

const KIND = {
  reh: { label: 'Rehearsal', cls: 't', color: 'var(--teal)' },
  story: { label: 'Story', cls: 'v', color: 'var(--violet)' },
  cv: { label: 'Resume', cls: 'warn', color: 'var(--warn)' },
};
function kindChip(k) { return `<span class="chip ${KIND[k].cls}">${KIND[k].label}</span>`; }
function checkGroup(k, title, done, total, items, status) {
  return `<details class="cgroup" style="border-left-color:${KIND[k].color}">
    <summary>
      <div class="between"><div class="row" style="gap:8px">${kindChip(k)}<h3>${title}</h3></div><div class="row" style="gap:10px"><span class="small mono">${done} of ${total} done</span><span class="caret" aria-hidden="true">▾</span></div></div>
      <div class="bar ${k === 'story' ? 'v' : ''}"><span style="width:${Math.round(done / total * 100)}%;${k === 'cv' ? 'background:var(--warn)' : ''}"></span></div>
      <div class="small muted">${status}</div>
    </summary>
    <div>${items}</div></details>`;
}
function checkItem(done, text, sub, href, label, next) {
  return `<div class="planitem${next ? ' next' : ''}"><span class="check${done ? ' done' : ''}" aria-label="${done ? 'Done' : 'To do'}"></span><div class="stack" style="gap:2px;flex:1"><span${done ? ' class="muted" style="text-decoration:line-through"' : next ? ' style="font-weight:600"' : ''}>${text}</span>${sub ? `<span class="small muted">${sub}</span>` : ''}</div>${href ? `<a class="btn ${next ? '' : 'ghost'} sm" ${href.includes(':') ? ivLink(href.split(':')[1]) : `href="#${href}"`}>${label}</a>` : ''}</div>`;
}
function planCard() {
  if (state.planStyle === 'weekly') {
    return `<div class="card coach">
      <div class="between"><div class="row">${av('c', 28)}<h2>This week's plan</h2></div><span class="muted small">Oct 27 to Nov 2 · <a href="#profile">Change style</a></span></div>

      <div>
        <div class="planitem"><span class="day">Mon</span><span class="check done" aria-label="Done"></span><div class="stack" style="gap:4px;flex:1"><span class="muted" style="text-decoration:line-through">Fix the short summary</span>${kindChip('cv')}</div></div>
        <div class="planitem next"><span class="day">Today</span><span class="check" aria-label="To do"></span><div class="stack" style="gap:4px;flex:1"><strong>Take: Stripe · Behavioral, Realistic</strong><span class="small muted">Readiness ${readiness()} of 75. Your onsite is in 6 days.</span>${kindChip('reh')}</div><a class="btn sm" ${ivLink('beh')}>Start</a></div>
        <div class="planitem"><span class="day">Thu</span><span class="check" aria-label="To do"></span><div class="stack" style="gap:4px;flex:1"><span>Get "Pushback from platform" to Ready</span><span class="small muted">3 of 5 parts written</span>${kindChip('story')}</div><a class="btn ghost sm" href="#review">Open</a></div>
        <div class="planitem"><span class="day">Fri</span><span class="check" aria-label="To do"></span><div class="stack" style="gap:4px;flex:1"><span>Add a second achievement to Invoicely</span>${kindChip('cv')}</div><a class="btn ghost sm" href="#cv">Open</a></div>
        <div class="planitem"><span class="day">Sat</span><span class="check" aria-label="To do"></span><div class="stack" style="gap:4px;flex:1"><span>Take: Stripe · Hiring manager</span><span class="small muted">Readiness 40 of 75</span>${kindChip('reh')}</div><a class="btn ghost sm" ${ivLink('hm')}>Open</a></div>
      </div></div>`;
  }
  const r = readiness();
  return `<div class="card coach">
    <div class="between"><div class="row">${av('c', 28)}<h2>Your readiness checklist</h2></div><span class="muted small">${r >= 75 ? 4 : 3} of 10 done · <a href="#profile">Change style</a></span></div>
    ${checkGroup('reh', 'Rehearsals', 0, 4,
      checkItem(false, 'Stripe · Behavioral: readiness 75 or more', `Now ${r}`, 'interview:beh', 'Take', true) +
      checkItem(false, 'Stripe · Hiring manager: readiness 75 or more', 'Now 40', 'interview:hm', 'Take') +
      checkItem(false, 'Stripe · Technical Q&amp;A: readiness 75 or more', 'Not started', 'interview:tech', 'Start') +
      checkItem(false, 'Shopify · Behavioral: readiness 75 or more', 'Not started', 'interview:sbeh', 'Start'),
      `Next: Stripe · Behavioral, ${r} of 75 · 1 in progress · 2 not started`)}
    ${checkGroup('story', 'Story completion', 2, 4,
      checkItem(true, 'Ownership: a Proven story', 'Checkout migration') +
      checkItem(true, 'Impact: a Ready story', 'Payments outage') +
      checkItem(false, 'Conflict handling: a Ready story', '"Pushback from platform" has 3 of 5 parts', 'review', 'Open') +
      checkItem(false, 'Learning from failure: a Ready story', 'No story yet', 'craft', 'Craft with Strova'),
      'Next: Conflict handling, 3 of 5 parts · 1 Proven · 1 Ready · 1 missing')}
    ${checkGroup('cv', 'Resume gaps and issues', 1, 3,
      checkItem(true, 'Fix the short summary') +
      checkItem(false, 'Add a second achievement to Invoicely', 'Also gives you a new story idea', 'cv', 'Fix') +
      checkItem(false, 'Add Celery to Skills, or accept as it is', '', 'cv', 'Fix'),
      'Next: add a second achievement to Invoicely · 2 issues open')}
  </div>`;
}

V.craft = () => {

  }
  const done = n >= CRAFT.length;
  return shell('stories', `
    <div class="between"><div class="stack" style="gap:4px"><div class="eyebrow">Craft with Strova</div><h1>Build a story</h1></div><div class="seg" aria-label="Coaching style"><button class="on">Gentle</button><button>Direct</button></div></div>
    <div class="grid2" style="grid-template-columns:minmax(0,3fr) minmax(0,2fr)">
      <div class="card"><div class="chat">${lines.join('')}${done ? `<div class="chatline">${av('c', 28)}<div class="bubble s">That's a complete story. I saved it as Ready. Want to practice a take?</div></div>` : ''}</div>
        ${done ? `<div class="row"><a class="btn" href="#story" data-act="pick-story" data-v="migration">Open the story</a><a class="btn ghost" href="#stories">All stories</a></div>` : `<div class="row" style="border-top:1px solid var(--line);padding-top:12px"><span class="muted small" style="flex:1">Tap to talk, or type your answer</span><button class="btn" data-act="craft-next">Send the answer</button></div>`}</div>
      <div class="card"><div class="row">${strova(state.craftStep >= CRAFT.length ? 'celebrating' : 'thinking', 72)}<span class="small muted">${state.craftStep >= CRAFT.length ? 'Strova saved your story as Ready.' : 'Strova is shaping your story from your words.'}</span></div><div class="between"><h3>Taking shape</h3><span class="chip ${filled.length === 5 ? 'v' : ''}">${filled.length === 5 ? 'Ready' : 'Draft'}</span></div>
        ${PARTS.map(([k, l, t]) => `<div class="part"><span class="lbl" style="color:var(--p-${k})">${filled.includes(k) ? '●' : '○'} ${l}</span><span class="small ${filled.includes(k) ? '' : 'muted'}">${filled.includes(k) ? t : 'Not yet'}</span></div>`).join('')}
        <p class="small muted">Strova uses only your words. Nothing is added that you didn't say.</p></div>
    </div>`);
};

V.review = () => shell('stories', `
  <div class="stack" style="gap:4px"><div class="eyebrow">Review with Strova</div><h1>Pushback from platform</h1><p class="small muted">You wrote this story. Strova reviews it part by part.</p></div>
  <div class="grid2" style="grid-template-columns:minmax(0,3fr) minmax(0,2fr)">
    <div class="card">
      <div class="part"><span class="lbl" style="color:var(--p-context)">● Context</span><span>The platform team refused to change an API my team needed for the new checkout.</span></div>
      <div class="part"><span class="lbl" style="color:var(--p-stakes)">● Stakes</span><span>Without it, we would miss the holiday launch.</span></div>
      <div class="part"><span class="lbl" style="color:var(--p-action)">● Your action</span><span>${state.reviewApplied ? 'I set up a meeting with their lead, showed the error data from our side, and offered to write the change myself under their review.' : 'We talked to them and worked it out.'}</span></div>
      <div class="part"><span class="lbl" style="color:var(--p-result)">○ Result</span><span class="muted">Not written yet</span></div>
      <div class="part"><span class="lbl" style="color:var(--p-reflection)">○ Reflection</span><span class="muted">Not written yet</span></div>
      ${state.reviewed ? '' : `<div class="row"><button class="btn" data-act="review">Review with Strova</button><button class="btn ghost" data-act="toast" data-v="Strova would continue this story with you, starting from the result">Craft the rest with Strova</button></div>`}
    </div>
    <div class="card coach">${state.reviewed ? `
      <div class="row">${strova('analysing', 72)}<h3>Strova's review</h3></div>
      <div class="notice ok small"><strong>Context and stakes are clear.</strong> An interviewer knows what was at risk.</div>
      ${state.reviewApplied ? `<div class="notice ok small"><strong>Your action updated.</strong></div>` : `
      <div class="card tight"><span class="eyebrow">Your action is too vague</span><span class="small">"We worked it out" hides what you did. In your Stripe take you described it better:</span>
        <div class="diff"><del>We talked to them and worked it out.</del><br><ins>I set up a meeting with their lead, showed the error data from our side, and offered to write the change myself under their review.</ins></div>
        <div class="row"><button class="btn sm" data-act="review-apply">Accept</button><button class="btn quiet sm" data-act="toast" data-v="Skipped">Skip</button></div></div>`}
      <div class="notice warn small"><strong style="color:var(--warn-ink)">Result and reflection are missing.</strong> What changed after the API was updated? <button class="btn quiet sm" style="padding:0" data-act="toast" data-v="Strova would ask you about the result, then the reflection">Answer with Strova</button></div>` : `
      <div class="row">${av('c', 28)}<h3>Ask Strova to review</h3></div><p class="small muted">Strova checks each part against what interviewers look for: your own role, a measurable result, trade-offs and what you learned. Suggested edits use your own words, and you accept or skip each one.</p>`}
    </div>
  </div>`);

const STORIES = {
  checkout: { title: 'Checkout migration', status: 'Proven', skills: 'Ownership, Impact, Collaboration', parts: () => ["Shoply's checkout ran on a billing service that could not scale for the holiday peak. 40,000 merchants depended on it.", 'A failed cutover would stop refunds for every merchant in the busiest week.', state.applied ? 'I wrote the plan, chose a dual-write over a big-bang cutover to keep refunds live, and ran the cutover myself.' : 'I wrote the plan and ran the cutover myself.', 'Zero downtime, and checkout latency fell by 40%.', 'Bring the platform team in earlier; their review caught two risks late.'], used: 'Leads for Ownership.', note: 'For Stripe: bring forward the 40,000 merchants.', source: 'Your resume: "Built the refunds API used by 40,000 merchants"', takes: '3 takes · best 3.5 of 4', sugg: () => !state.applied },
  outage: { title: 'Payments outage', status: 'Ready', skills: 'Ownership, Impact', parts: () => ['A deploy broke card payments for 12% of checkouts on a Friday evening.', 'Every minute cost merchants sales and put our status page on the news.', 'I rolled back, led the incident call, and wrote the fix for the retry logic.', 'Payments recovered within the hour.', 'We added a canary step to every payments deploy.'], used: 'Backs up Impact (thin: the result has no number).', note: 'For Stripe: say how many payments recovered, and how fast.', source: 'Written by you', takes: 'No takes yet', sugg: () => false },
  migration: { title: 'Database migration', status: 'Ready', skills: 'Ownership, Technical depth', parts: () => PARTS.map(p => p[2]), used: 'Not used by a role yet.', note: '', source: 'Your resume: "Led migration of 30 services to PostgreSQL 15 with zero downtime"', takes: 'No takes yet', sugg: () => false },
};
V.story = () => {
  const S = STORIES[state.story] || STORIES.checkout;
  const steps = ['Draft', 'Ready', 'Proven'].map(x => `<span class="chip ${x === S.status ? (x === 'Proven' ? 'ok' : 'v') : ''}">${x}</span>`).join('→');
  const parts = S.parts();
  return shell('stories', `
  <a href="#stories" class="small">All stories</a>
  <div class="between"><div class="stack" style="gap:8px"><div class="row"><h1>${S.title}</h1><span class="chip ${S.status === 'Proven' ? 'ok' : 'v'}">${S.status}</span></div>
    <div class="row small muted">${steps}<span>· proves ${S.skills}</span></div></div>
    <div class="row"><button class="btn" data-act="toast" data-v="A practice take would start here">Practice a take</button><button class="btn ghost" data-act="toast" data-v="Strova would review this story part by part">Review with Strova</button></div></div>
  ${S.sugg() ? `<div class="card coach"><span class="eyebrow">Strova suggests · from your Stripe take, answer 1</span><span>Add the trade-offs you named out loud to Your action.</span>
    <div class="diff"><del>I wrote the plan and ran the cutover myself.</del><br><ins>I wrote the plan, chose a dual-write over a big-bang cutover to keep refunds live, and ran the cutover myself.</ins></div>
    <div class="row"><button class="btn sm" data-act="apply">Apply</button><button class="btn quiet sm" data-act="toast" data-v="Dismissed">Dismiss</button></div></div>` : ''}
  <div class="grid2" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
    <div class="card"><div class="row small"><strong style="border-bottom:2px solid var(--violet);padding-bottom:6px">Story parts</strong><span class="muted">60-second version</span><span class="muted">Full version</span></div>
      ${PARTS.map(([k, l], i) => `<div class="part"><span class="lbl" style="color:var(--p-${k})">● ${l}</span><span>${parts[i]}</span></div>`).join('')}
    </div>
    <div class="stack" style="gap:16px">
      <div class="card"><h3>Used for</h3>${S.note ? `<a ${roleLink('stripe')}><strong>Stripe · Senior SWE</strong></a>` : ''}<span class="small">${S.used}</span>${S.note ? `<span class="notice t small">${S.note}</span>` : ''}</div>
      <div class="card"><h3>Where it came from</h3><span class="small">${S.source}</span><span class="small muted">${S.takes}</span></div>
    </div>
  </div>`);
};

V.profile = () => shell('', `
  <h1>Profile</h1>
  <div class="card"><h2>Your plan style</h2><p class="small muted">Strova keeps one plan for your stories, your resume and your interviews. Switch any time; your progress stays.</p>${planStyleBody(true)}</div>
  <div class="card"><h2>Reminders from Strova</h2>
    <div class="between"><div><strong>In the app</strong><br><span class="small muted">When a plan item is due, or your interview is close.</span></div><span class="chip ok">On</span></div>
    <div class="between"><div><strong>By email</strong><br><span class="small muted">Same reminders, from "Strova from Strong Hire".</span></div><button class="btn ghost sm" data-act="toast" data-v="Email reminders muted">Mute email</button></div>
  </div>
  <div class="card"><h2>Account</h2><span class="small">Ana Lopez · ana@example.com · Senior · 7 years</span><span class="small muted">Billing, data export and account deletion live here too.</span></div>`);

// Router and guide
function current() { const h = location.hash.replace('#', ''); return V[h] ? h : 'start'; }
function renderGuide(view) {
  const f = FLOWS.find(x => x.id === flowId);
  let pos = f.steps.indexOf(view, flowPos > 0 ? flowPos - 1 : 0);
  if (pos === -1) pos = f.steps.indexOf(view);
  if (pos !== -1) flowPos = pos;
  const inFlow = f.steps.length && pos !== -1;
  const nextV = inFlow && pos < f.steps.length - 1 ? f.steps[pos + 1] : null;
  const prevV = inFlow && pos > 0 ? f.steps[pos - 1] : null;
  document.getElementById('guide').innerHTML = `
    <span class="tag">Prototype</span>
    <label for="flowpick" class="step">Walk through</label>
    <select id="flowpick">${FLOWS.map(x => `<option value="${x.id}" ${x.id === flowId ? 'selected' : ''}>${x.name}</option>`).join('')}</select>
    <span class="step">${inFlow ? `Step ${pos + 1} of ${f.steps.length}` : f.steps.length ? 'Off this flow' : 'Click anywhere'}</span>
    <button class="gbtn" data-act="flow-prev" ${prevV ? '' : 'disabled'}>Back</button>
    <button class="gbtn primary" data-act="flow-next" ${nextV || (f.steps.length && !inFlow) ? '' : 'disabled'}>${!inFlow && f.steps.length ? 'Go to start' : 'Next step'}</button>
    <span class="spacer"></span>
    <button class="gbtn" data-act="reset">Reset demo</button>
    <span class="step">Comment on any screen to request a change</span>`;
}
function render() {
  const view = current();
  clearTimeout(render.t);
  if (view === 'reading') render.t = setTimeout(() => go('cv-ready'), 2600);
  document.getElementById('app').innerHTML = V[view]();
  renderGuide(view);
  document.title = 'Strong Hire Mockups';
}
function go(v) { if (location.hash === '#' + v) render(); else location.hash = v; window.scrollTo(0, 0); }
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2200); }

document.addEventListener('submit', e => {
  if (e.target.matches('[data-ask]')) { e.preventDefault(); toast('Strova would answer here, using your stories and roles'); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'flowpick') { flowId = e.target.value; flowPos = 0; const f = FLOWS.find(x => x.id === flowId); if (f.steps.length) { if (f.id === 'f2') state.roleStep = 1; go(f.steps[0]); } else render(); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  const f = FLOWS.find(x => x.id === flowId);
  if (a === 'flow-next') { const view = current(); const p = f.steps.indexOf(view, flowPos); if (p === -1) { flowPos = 0; go(f.steps[0]); } else { flowPos = p + 1; go(f.steps[p + 1]); } return; }
  if (a === 'flow-prev') { flowPos = Math.max(0, flowPos - 1); go(f.steps[flowPos]); return; }
  if (a === 'reset') { Object.assign(state, { planStyle: 'weekly', tookTake: false, applied: false, craftStep: 0, reviewed: false, reviewApplied: false, roleStep: 1, drawer: false, ideasDismissed: {}, liveMode: 'listening', iv: 'beh', role: 'stripe', story: 'checkout' }); save(); flowId = 'f1'; flowPos = 0; go('start'); toast('Demo reset'); return; }
  if (a === 'style') { state.planStyle = v; save(); render(); return; }
  if (a === 'toast') { toast(v); return; }
  if (a === 'dismiss-idea') { state.ideasDismissed[v] = true; save(); render(); toast('Removed from story ideas'); return; }
  if (a === 'role-step') { state.roleStep = Number(v); save(); render(); return; }
  if (a === 'role-done') { state.roleStep = 1; state.role = 'stripe'; save(); toast('Stripe added with 3 interviews'); return; }
  if (a === 'drawer') { state.drawer = !state.drawer; save(); render(); return; }
  if (a === 'take-done') { if (state.iv === 'beh') state.tookTake = true; save(); return; }
  if (a === 'pick-iv') { state.iv = v; state.role = IVS[v].role; save(); if (location.hash === '#interview') render(); return; }
  if (a === 'pick-role') { state.role = v; save(); if (location.hash === '#role') render(); return; }
  if (a === 'pick-story') { state.story = v; save(); if (location.hash === '#story') render(); return; }
  if (a === 'live-mode') { state.liveMode = v; save(); render(); return; }
  if (a === 'apply') { state.applied = true; save(); render(); toast('Applied to Checkout migration'); return; }
  if (a === 'undo-apply') { state.applied = false; save(); render(); toast('Restored the earlier version'); return; }
  if (a === 'craft-next') { state.craftStep = Math.min(CRAFT.length, state.craftStep + 1); save(); render(); return; }
  if (a === 'review') { state.reviewed = true; save(); render(); return; }
  if (a === 'write-review') { state.reviewed = true; save(); return; }
  if (a === 'write-save') { toast('Saved as a Draft'); return; }
  if (a === 'review-apply') { state.reviewApplied = true; save(); render(); toast('Your action updated'); return; }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
</script>
