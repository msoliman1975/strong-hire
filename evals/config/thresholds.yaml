# Pass or fail lines for the eval report. "source" says where each number comes from.
# Metrics without min or max are shown for information only.
scorer_within_one_band:
  min: 0.85
  source: "Spec, Calibration and Metrics: within one band on 85% or more of the gold set"
scorer_exact:
  source: "No threshold in the spec. Shown for information"
rubric_within_one_point:
  source: "No threshold in the spec. Shown for information"
value_within_one_point:
  source: "No threshold in the spec. Shown for information (IV-5 company values)"
follow_up_rate:
  min: 0.80
  source: "Harness default. IV-3 asks for follow-ups on vague answers but gives no number"
competency_coverage:
  min: 0.80
  source: "Harness default. The brief lists 4 to 6 target competencies; the spec gives no number"
cost_per_session_usd:
  max: 0.80
  source: "Spec, Metrics: cost per session under $0.80"
gap_score_spread:
  max: 3
  source: "P6 prompt: same inputs give match scores within 3 points across runs (GA-1)"
gap_fit_order:
  min: 1.0
  source: "Harness default. A resume written for the job should score above one for another role"
gap_cost_usd:
  source: "Spec, Pricing: planner and gap analysis about $0.05 per session. Shown for information"
debrief_ready_s:
  max: 60
  source: "Spec FB-3: debrief ready within 60 seconds of session end. Measured as the slowest scorer run"
coach_invented_facts:
  max: 0
  source: "Spec CO-9: the coach never adds facts the candidate did not say. Code checks on every profile, the judge off the fake profile"
coach_one_question:
  min: 1.0
  source: "Spec CO-4: one question at a time"
coach_iv3_followup:
  min: 0.80
  source: "Harness default, same bar as follow_up_rate. IV-3 asks for follow-ups on vague answers but gives no number"
coach_judge_pass:
  min: 0.90
  source: "Harness default. Share of applicable judge verdicts that pass, all coach rules"
coach_style_distinct:
  min: 0.75
  source: "Harness default. CO-5: the judge tells direct from gentle in 3 of 4 candidate pairs"
coach_versions_faithful:
  min: 1.0
  source: "Spec CO-8, CO-9: every version quotes only the candidate's words"
coach_dropped_updates:
  source: "Information. Part updates the engine dropped because the quotes did not match (CO-3)"
coach_cost_per_session_usd:
  source: "Information. Coach minutes are not priced yet"
suggestions_invented_facts:
  max: 0
  source: "Spec SG-7: tune, new story, improve resume line and review use only the user's words. On the fake profile, each case's reply must be kept or rejected as expected"
