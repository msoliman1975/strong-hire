- id: rp-negotiation-close
  interview_type: role_play
  role_play: negotiation_close
  duration_min: 10
  level: senior
  quality: average
  job_text: |-
    Senior Enterprise Account Executive
    Sentinel Data
    New York, NY (hybrid)

    Sentinel Data sells data security software to large banks and insurers. Enterprise deals take 6 to 12 months.

    What you will do:
    - Own a territory of 25 enterprise accounts
    - Lead complex deals with many buyers and a procurement team
    - Build mutual close plans with champions
    - Work with sales engineers on demos and security reviews

    What you need:
    - 7+ years in enterprise software sales
    - Closed deals above 500,000 dollars
    - Selling to financial services
    - Forecast accuracy

    Nice to have:
    - Security or compliance products
    - MEDDICC or Challenger training
  cv_text: |-
    Morgan Ellis
    morgan.ellis@example.com

    Enterprise Account Executive, Vaultline Security (2017 to now)
    - Closed three deals above 1 million dollars with banks, each with a 9-month cycle
    - Built mutual close plans with champions in IT security and procurement

    Account Executive, Brightdesk (2013 to 2017)
    - 110 percent of quota on average over four years

    Skills: enterprise sales, negotiation, Challenger, Salesforce
- id: rp-escalation-call
  interview_type: role_play
  role_play: escalation_call
  duration_min: 10
  level: mid
  quality: average
  job_text: |-
    Customer Success Manager
    Tallyhouse
    Remote, US

    Tallyhouse sells inventory software to 900 mid-size retailers. Customer success managers own a book of
    about 40 accounts from onboarding to renewal.

    What you will do:
    - Onboard new customers and drive adoption across their stores
    - Run quarterly business reviews with each customer's executive sponsor
    - Spot churn risk early and lead escalations with support and engineering
    - Own renewals and find expansion opportunities

    What you need:
    - 2 or more years in customer success or account management at a SaaS company
    - Calm, clear communication with upset customers
    - Comfort with health scores and usage data

    Nice to have:
    - Gainsight or a similar tool
    - Retail or supply chain experience
  cv_text: |-
    Jordan Okafor
    jordan.okafor@example.com

    Customer Success Manager, Shelfwise (2023 to now)
    - Managed 35 mid-market accounts worth 2.1 million dollars a year; gross retention 94 percent
    - Led 6 escalations after a data sync outage; kept 5 of the 6 accounts through renewal
    - Ran quarterly business reviews and grew three accounts by adding stores

    Support Specialist, Shelfwise (2021 to 2023)
    - Resolved 40 tickets a week with a 96 percent satisfaction score
    - Wrote the onboarding guide used for every new customer

    Education
    B.A. Communications, University of Georgia, 2021
