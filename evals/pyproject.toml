[project]
name = "strong-evals"
version = "0.1.0"
description = "Strong Hire eval harness: scripted transcripts, simulated candidate, gold set, metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "strong-core",
    "strong-worker",
    "pyyaml>=6.0",
]

[tool.uv.sources]
strong-core = { workspace = true }
strong-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strong_evals"]
