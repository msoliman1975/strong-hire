[project]
name = "strong-core"
version = "0.1.0"
description = "Shared contracts for Strong Hire: config, schemas, database models, model gateway, prompt loader"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic-ai-slim[openai]>=2.50,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strong_core"]
