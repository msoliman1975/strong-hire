[project]
name = "strong-interview"
version = "0.1.0"
description = "Strong Hire interviewer: session controller and interviewer turn logic (P7)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "strong-core",
]

[tool.uv.sources]
strong-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strong_interview"]
