[project]
name = "strong-api"
version = "0.1.0"
description = "Strong Hire HTTP API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "strong-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "arq>=0.26",
    "python-multipart>=0.0.9",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "email-validator>=2.2",
]

[tool.uv.sources]
strong-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strong_api"]
