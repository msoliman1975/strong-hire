[project]
name = "strong-worker"
version = "0.1.0"
description = "Strong Hire background workers (Arq)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "strong-core",
    "arq>=0.26",
]

[tool.uv.sources]
strong-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strong_worker"]
