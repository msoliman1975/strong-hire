[project]
name = "strong-worker"
version = "0.1.0"
description = "Strong Hire background workers (Arq)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "strong-core",
    "arq>=0.26",
    "trafilatura>=1.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "cryptography>=43",
    "httpx>=0.27",
    "lxml>=5.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.47",
]

[tool.uv.sources]
strong-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strong_worker"]
