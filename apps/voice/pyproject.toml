[project]
name = "strong-voice"
version = "0.1.0"
description = "Strong Hire voice agent (LiveKit Agents). Stub until P1."
requires-python = ">=3.12,<3.13"
dependencies = [
    "strong-core",
]

[tool.uv.sources]
strong-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strong_voice"]
