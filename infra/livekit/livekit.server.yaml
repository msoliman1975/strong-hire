# LiveKit server on the test server (infra/compose.server.yaml). Keys come from LIVEKIT_KEYS and
# the public IP from --node-ip. Caddy terminates TLS for signaling (https://rtc.$DOMAIN -> 7880).
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
logging:
  level: info
