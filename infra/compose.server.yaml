# Override for the test server (Hetzner). ./scripts/profile.ps1 adds it with -f when .env has
# STACK_TARGET=server; do not use it alone. See docs/hosting.md.
#   - Caddy is the only public entry: https://$DOMAIN (web and /api), https://admin.$DOMAIN
#     (the admin app and its own /api) and https://rtc.$DOMAIN (LiveKit signaling). LiveKit media also uses 7881/tcp and 7882/udp.
#   - Other services publish no host ports, except the API and LiteLLM on 127.0.0.1 for
#     ./scripts/profile.ps1 (health check, LiteLLM app key).
#   - The API runs without --reload, in staging mode (no dev login, real session secret).
services:
  caddy:
    build:
      context: ..
      dockerfile: infra/docker/caddy.Dockerfile
    profiles: [core, all-in-one]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped

  api:
    ports: !override ["127.0.0.1:${API_PORT:-8700}:8000"]
    command: ["uvicorn", "strong_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      APP_ENV: staging
      LOG_FORMAT: json   # OB-7: one JSON object per log line (service, request_id, session_id)
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      WEB_BASE_URL: https://app.${DOMAIN}
      API_PUBLIC_URL: https://app.${DOMAIN}/api
      # The admin app (D-1). Its sign-in links and Google sign-in come back to this host.
      ADMIN_BASE_URL: https://admin.${DOMAIN}
      # Alerts page "Test" button (AL-6) sends to this address.
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # Suspending a user (AU-7) removes them from a live voice room through LiveKit's internal API.
      LIVEKIT_URL: http://livekit:7880
      # Server share per session on the overview (OB-15, D-12): the Hetzner server's monthly price.
      INFRA_MONTHLY_USD: ${INFRA_MONTHLY_USD:-18.49}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Emails that see the model spend meter (strong_api.devtools). Testers do not.
      MODEL_SPEND_VIEWERS: ${MODEL_SPEND_VIEWERS:-}
      # AA-1: seeds the admins of https://admin.$DOMAIN on the first start (admin_users empty).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      LIVEKIT_PUBLIC_URL: wss://rtc.${DOMAIN}
      STRONG_INTERNAL_TOKEN: ${STRONG_INTERNAL_TOKEN:?set STRONG_INTERNAL_TOKEN in .env}
      # The AI candidate (P13, docs/sim-candidate.md). Off unless SIM_ENABLED=true in .env.
      SIM_ENABLED: ${SIM_ENABLED:-false}
      SIM_TOKEN: ${SIM_TOKEN:-}
      SIM_EMAIL: ${SIM_EMAIL:-sim@getstronghire.com}
      # The sim's own LiteLLM key with a $5 daily budget, so AI-to-AI tests never use the app's.
      SIM_LITELLM_KEY: ${SIM_LITELLM_KEY:-}
      SIM_RESULTS_DIR: /sim-results
    volumes:
      # Saved sim runs, read-only, so the admin area can serve sim voice recordings (P13).
      - /srv/stronghire/sim:/sim-results:ro
    restart: unless-stopped

  # The sim service (docs/admin-spec.md, Simulations): runs admin-started AI candidate
  # interviews one at a time, writes /srv/stronghire/sim and applies its retention (SM-14).
  # Start it with --profile sim. It talks to the app through the public URL, like a browser,
  # and to LiteLLM with the sim key, so the $5/day sim budget covers both sides.
  # Capped so live users keep the CPU (D-17).
  sim:
    build:
      context: ..
      dockerfile: infra/sim/sim.Dockerfile
    image: strong-sim:latest
    profiles: [sim]
    command: ["serve"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-strong}:${POSTGRES_PASSWORD:-strong}@postgres:5432/${POSTGRES_DB:-strong}
      MODEL_PROFILE: sim
      MODEL_GATEWAY_URL: http://litellm:4000/v1
      MODEL_GATEWAY_API_KEY: ${SIM_LITELLM_KEY:-}
      SIM_ENABLED: ${SIM_ENABLED:-false}
      SIM_EMAIL: ${SIM_EMAIL:-sim@getstronghire.com}
      SIM_LITELLM_KEY: ${SIM_LITELLM_KEY:-}
      SIM_TOKEN: ${SIM_TOKEN:-}
      SIM_BASE_URL: https://app.${DOMAIN}/api
      SIM_OUT_DIR: /sim-results
      SIM_KEEP_GB: ${SIM_KEEP_GB:-10}
      SIM_KEEP_DAYS: ${SIM_KEEP_DAYS:-90}
      REPO_ROOT: /app
    volumes:
      - /srv/stronghire/sim:/sim-results
    depends_on:
      postgres: { condition: service_healthy }
      litellm: { condition: service_started }
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped

  worker:
    environment:
      APP_ENV: staging
      ENV: staging
      LOG_FORMAT: json   # OB-7
      # Encrypted resume files, kept in a volume so they survive restarts.
      INPUTS_STORAGE_DIR: /data/uploads
      INPUTS_STORAGE_KEY: ${INPUTS_STORAGE_KEY:?set INPUTS_STORAGE_KEY in .env}
      # The sim org's jobs (extraction, gap, brief, scoring) use the sim key (P13).
      SIM_ENABLED: ${SIM_ENABLED:-false}
      SIM_EMAIL: ${SIM_EMAIL:-sim@getstronghire.com}
      SIM_LITELLM_KEY: ${SIM_LITELLM_KEY:-}
      # The alert engine (docs/alerts.md): every alert goes to ALERT_EMAIL (D-10), by SMTP.
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_DIGEST: ${ALERT_DIGEST:-false}
      ADMIN_BASE_URL: https://admin.${DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - uploads-data:/data/uploads
      # OB-5: the metrics sampler reads the Postgres volume's disk use (host.disk_pct, pgdata).
      - postgres-data:/mnt/pgdata:ro
    restart: unless-stopped

  # Caddy serves the built web app, so the Vite dev server is not needed.
  web:
    ports: !reset []
    profiles: [dev-only]

  ollama:
    ports: !reset []

  litellm:
    ports: !override ["127.0.0.1:${LITELLM_PORT:-4000}:4000"]
    restart: unless-stopped

  livekit:
    # Production mode: keys from LIVEKIT_KEYS, media announced on the server's public IP.
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${SERVER_IP:?set SERVER_IP in .env}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    ports: !override
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit/livekit.server.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  voice:
    environment:
      LOG_FORMAT: json   # OB-7
      LIVEKIT_PUBLIC_URL: wss://rtc.${DOMAIN}
      STRONG_INTERNAL_TOKEN: ${STRONG_INTERNAL_TOKEN}
      # The sim org's voice interviews use the sim key (P13).
      SIM_ENABLED: ${SIM_ENABLED:-false}
      SIM_EMAIL: ${SIM_EMAIL:-sim@getstronghire.com}
      SIM_LITELLM_KEY: ${SIM_LITELLM_KEY:-}
    restart: unless-stopped

  stt:
    ports: !reset []
    environment:
      STT_CPU_THREADS: "4"
    restart: unless-stopped

  tts:
    ports: !reset []
    restart: unless-stopped

volumes:
  uploads-data:
  caddy-data:
  caddy-config:
