# Strong Hire local stack. Use scripts/dev.ps1 rather than calling this file directly.
#   core:   postgres, redis, api, worker, web
#   models: ollama (CPU), litellm proxy
#   voice:  livekit-server (dev mode), voice agent, stt (faster-whisper), tts (Kokoro)
#   all-in-one: every service above, for the smallest machine; set MODEL_PROFILE=tiny and
#               LITELLM_PROFILE=tiny in .env (PL-2)
# Which models answer each role is set only in config/ (MODEL_PROFILE, LITELLM_PROFILE).
# Host ports come from .env (see .env.example); the defaults below match it.
name: strong-hire

x-python-env: &python-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-strong}:${POSTGRES_PASSWORD:-strong}@postgres:5432/${POSTGRES_DB:-strong}
  REDIS_URL: redis://redis:6379/0
  MODEL_PROFILE: ${MODEL_PROFILE:-fake}
  MODEL_GATEWAY_URL: http://litellm:4000/v1
  # The app key from ./scripts/profile.ps1 claude (budget and rate limit), else the master key.
  MODEL_GATEWAY_API_KEY: ${LITELLM_APP_KEY:-${LITELLM_MASTER_KEY:-sk-local-dev-only}}
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-only}
  REPO_ROOT: /app

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

services:
  # ---------------------------------------------------------------- core
  postgres:
    image: postgres:16-alpine
    profiles: [core, all-in-one]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong}
      POSTGRES_DB: ${POSTGRES_DB:-strong}
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  redis:
    image: redis:7-alpine
    profiles: [core, all-in-one]
    ports: ["${REDIS_PORT:-56379}:6379"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  api:
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      args: { PACKAGE: strong-api, APP_DIR: apps/api }
    profiles: [core, all-in-one]
    environment:
      <<: *python-env
      # P9 billing (BL-1, BL-2). Empty Stripe keys: checkout and the portal answer 503.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      BILLING_PRICE_USD_MONTH: ${BILLING_PRICE_USD_MONTH:-29}
      BILLING_MINUTES_CAP: ${BILLING_MINUTES_CAP:-300}
      BILLING_FREE_INTERVIEWS: ${BILLING_FREE_INTERVIEWS:-2}
      ACCOUNT_EXPORT_TTL_S: ${ACCOUNT_EXPORT_TTL_S:-86400}
      ACCOUNT_EXPORT_MAX_MB: ${ACCOUNT_EXPORT_MAX_MB:-100}
      # P7 voice sessions: tokens for the browser, and the voice agent's internal calls.
      LIVEKIT_PUBLIC_URL: ws://localhost:${LIVEKIT_PORT:-7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      STRONG_INTERNAL_TOKEN: ${STRONG_INTERNAL_TOKEN:-dev-internal-token}
    command: >-
      uvicorn strong_api.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/apps/api/src --reload-dir /app/packages/core/src
    ports: ["${API_PORT:-8700}:8000"]
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages/core:/app/packages/core
      - ../packages/interview:/app/packages/interview
      - ../config:/app/config:ro
      - ../prompts:/app/prompts:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]

  worker:
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      args: { PACKAGE: strong-worker, APP_DIR: apps/worker }
    profiles: [core, all-in-one]
    environment: *python-env
    command: ["arq", "strong_worker.main.WorkerSettings"]
    volumes:
      - ../apps/worker/src:/app/apps/worker/src
      - ../packages/core:/app/packages/core
      - ../config:/app/config:ro
      - ../prompts:/app/prompts:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "arq", "--check", "strong_worker.main.WorkerSettings"]
      interval: 15s
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    profiles: [core, all-in-one]
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    ports: ["${WEB_PORT:-5180}:5180"]
    volumes:
      - ../apps/web/src:/app/src
      - ../apps/web/index.html:/app/index.html
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5180/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # ---------------------------------------------------------------- models
  ollama:
    # CPU inference. Pull the models in config/litellm.local.yaml with ./scripts/models.ps1 pull
    image: ollama/ollama:latest
    profiles: [models, all-in-one]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}   # CI uses 1 (7.9 GB of RAM)
      OLLAMA_NUM_PARALLEL: "1"
      # Also trust infra/certs/*.crt when pulling models (networks with TLS inspection).
      SSL_CERT_DIR: /etc/ssl/certs:/extra-certs
    ports: ["${OLLAMA_PORT:-11435}:11434"]
    volumes:
      - ollama-models:/root/.ollama
      - ./certs:/extra-certs:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "ollama", "list"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: [models, all-in-one]
    # Also trust infra/certs/*.crt (networks with TLS inspection): the entrypoint adds them to the
    # system CA bundle, and SSL_CERT_FILE points the HTTP clients at the result. Same image.
    entrypoint:
      - sh
      - -c
      - cat /etc/ssl/certs/ca-certificates.crt /extra-certs/*.crt > /tmp/ca-bundle.pem 2>/dev/null; exec docker/prod_entrypoint.sh "$$@"
      - --
    command: ["--config", "/app/litellm.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-only}
      HOSTED_API_KEY: ${HOSTED_API_KEY:-}
      # Kokoro TTS. scripts/kokoro-windows.ps1 runs it outside Docker; then .env sets
      # TTS_API_BASE=http://host.rancher-desktop.internal:8881/v1
      TTS_API_BASE: ${TTS_API_BASE:-http://tts:8880/v1}
      SSL_CERT_FILE: /tmp/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /tmp/ca-bundle.pem
    ports: ["${LITELLM_PORT:-4000}:4000"]
    volumes:
      - ../config/litellm.${LITELLM_PROFILE:-local}.yaml:/app/litellm.yaml:ro
      - ./certs:/extra-certs:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      start_period: 30s

  # ---------------------------------------------------------------- voice
  livekit:
    image: livekit/livekit-server:latest
    profiles: [voice, all-in-one]
    # --node-ip 127.0.0.1 so the browser on the Windows host can reach the media ports. The voice
    # agent shares this container's network (network_mode below), so 127.0.0.1 works for it too.
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
      - "${VOICE_HEALTH_PORT:-8081}:8081"    # the voice agent's health and dev page
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880 || exit 1"]

  voice:
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      args: { PACKAGE: strong-voice, APP_DIR: apps/voice }
    profiles: [voice, all-in-one]
    environment:
      <<: *python-env
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:${LIVEKIT_PORT:-7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      # The voice agent ends sessions through the API (billing and scoring), with a shared token.
      API_INTERNAL_URL: http://api:8000
      STRONG_INTERNAL_TOKEN: ${STRONG_INTERNAL_TOKEN:-dev-internal-token}
      VOICE_HEALTH_PORT: "8081"
      LATENCY_DIR: /app/var/latency
      HF_HOME: /models/hf
    # download-files fetches the VAD and turn detector models once into the voice-models volume.
    command: ["sh", "-c", "python -m strong_voice download-files && exec python -m strong_voice"]
    # Same network namespace as livekit: WebRTC media to 127.0.0.1 reaches the server. Its port
    # 8081 is published on the livekit service.
    network_mode: "service:livekit"
    volumes:
      - ../apps/voice/src:/app/apps/voice/src
      - ../apps/voice/devpage:/app/apps/voice/devpage:ro
      - ../packages/core:/app/packages/core
      - ../packages/interview:/app/packages/interview
      - ../config:/app/config:ro
      - ../prompts:/app/prompts:ro
      - ../var/latency:/app/var/latency
      - voice-models:/models
    depends_on:
      livekit: { condition: service_healthy }
      stt: { condition: service_healthy }
      tts: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      start_period: 120s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]

  stt:
    # faster-whisper on CPU, OpenAI-compatible /v1/audio/transcriptions (infra/stt/server.py).
    # The model to load comes from the request, which LiteLLM fills from config/.
    build: { context: .., dockerfile: infra/stt/Dockerfile }
    profiles: [voice, all-in-one]
    environment:
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      STT_CPU_THREADS: "4"
    ports: ["${STT_PORT:-8010}:8000"]
    volumes: [stt-models:/models]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]

  tts:
    # Kokoro-82M on CPU, OpenAI-compatible /v1/audio/speech with streaming PCM (24 kHz).
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: [voice, all-in-one]
    ports: ["${TTS_PORT:-8880}:8880"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8880/health', timeout=3)"]
      start_period: 120s

volumes:
  postgres-data:
  ollama-models:
  stt-models:
  voice-models:
